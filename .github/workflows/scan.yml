name: LowFly scan

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式"
        type: choice
        options: [normal, dry-run, test-telegram, force-digest, mock]
        default: normal
      run_checks:
        description: "執行離線驗收與前端靜態檢查"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

concurrency:
  group: lowfly-scan
  cancel-in-progress: false

jobs:
  # 先檢查 Secrets：排程觸發時若缺金鑰就「跳過」（黃色警告，不寄失敗信）；
  # 手動觸發或 issue 觸發時缺金鑰仍直接失敗，讓人一眼看到。
  preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issues' ||
       (github.actor == github.repository_owner &&
        startsWith(github.event.issue.title, '[LowFly scan]')))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: 檢查本次模式所需 Secrets
        id: secrets
        env:
          MODE: ${{ inputs.mode || 'normal' }}
          EVENT: ${{ github.event_name }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          case "$MODE" in
            mock) required=() ;;
            test-telegram) required=(TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID) ;;
            dry-run) required=(SERPAPI_API_KEY TRAVELPAYOUTS_TOKEN) ;;
            normal|force-digest) required=(SERPAPI_API_KEY TRAVELPAYOUTS_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID) ;;
            *) echo "不支援的執行模式" >&2; exit 2 ;;
          esac
          missing=()
          for secret_name in "${required[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then missing+=("$secret_name"); fi
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi
          echo "ready=false" >> "${GITHUB_OUTPUT:-/dev/null}"
          {
            echo "### LowFly：缺少 Secrets，本次未掃描"
            echo "尚未設定：\`${missing[*]}\`"
            echo "到 Settings → Secrets and variables → Actions → New repository secret 補上即可恢復。"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [[ "$EVENT" == "schedule" ]]; then
            for n in "${missing[@]}"; do
              echo "::warning title=Missing repository Secret::${n} 尚未設定；排程本次跳過，不掃描、不更新正式資料。"
            done
            exit 0
          fi
          for n in "${missing[@]}"; do
            echo "::error title=Missing repository Secret::${n} 尚未設定；本次不執行掃描，也不更新正式資料。"
          done
          exit 1

  scan:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安裝中文字體
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 安裝依賴
        run: pip install -r requirements-dev.txt
      - name: 離線驗收與靜態檢查
        if: github.event_name == 'schedule' || github.event_name == 'issues' || inputs.run_checks
        run: |
          python -m pytest -q
          node --check docs/app.js
          node --check docs/utils.js
          node --check docs/config.js
          node --check docs/sw.js
          node --test tests/frontend.test.cjs
          python scripts/check_exports.py
      - name: 執行掃描
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'normal' }}
        run: |
          case "$MODE" in
            normal) python -m lowfly.main ;;
            dry-run) python -m lowfly.main --dry-run ;;
            test-telegram) python -m lowfly.main --test-telegram ;;
            force-digest) python -m lowfly.main --force-digest ;;
            mock) python -m lowfly.main --mock --force-digest ;;
            *) echo "不支援的執行模式" >&2; exit 1 ;;
          esac
      - name: 檢查本次匯出
        if: inputs.mode == '' || inputs.mode == 'normal' || inputs.mode == 'force-digest'
        run: python scripts/check_exports.py
      - name: 儲存狀態與公開資料
        id: persist
        if: inputs.mode == '' || inputs.mode == 'normal' || inputs.mode == 'force-digest'
        run: |
          git config user.name "lowfly-bot"
          git config user.email "lowfly-bot@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT:-/dev/null}"
          else
            git commit -m "chore(state): scan $(date -u +'%Y-%m-%dT%H:%MZ') [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
            echo "changed=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          fi
      - name: 請求 main／docs 的 Pages 建置
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" \
            -H "Accept: application/vnd.github+json"
      - name: 保留模擬預覽
        if: inputs.mode == 'mock'
        uses: actions/upload-artifact@v4
        with:
          name: lowfly-mock-preview
          path: out/mock/
          retention-days: 7
