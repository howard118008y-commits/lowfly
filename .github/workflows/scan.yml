name: LowFly scan

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: "17 1,7,13,19 * * *"
    # 促銷月（config.yaml schedule.promo_months）加跑，合計每 3 小時一次；台北 00:17／06:17／12:17／18:17。
    - cron: "17 4,10,16,22 * 5,6,11,12 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式"
        type: choice
        options: [normal, dry-run, test-telegram, force-digest, mock]
        default: normal
      run_checks:
        description: "執行離線驗收與前端靜態檢查"
        type: boolean
        default: true

# 預設不給任何權限；只有 publish job 拿得到寫入權（見下）。
permissions: {}

concurrency:
  group: lowfly-scan
  cancel-in-progress: false

jobs:
  # 先檢查 Secrets：排程觸發時若缺金鑰就「跳過」（黃色警告，不寄失敗信）；
  # 手動觸發或 issue 觸發時缺金鑰仍直接失敗，讓人一眼看到。
  preflight:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issues' ||
       (github.actor == github.repository_owner &&
        startsWith(github.event.issue.title, '[LowFly scan]')))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: 檢查本次模式所需 Secrets
        id: secrets
        env:
          MODE: ${{ inputs.mode || 'normal' }}
          EVENT: ${{ github.event_name }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          case "$MODE" in
            mock) required=() ;;
            test-telegram) required=(TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID) ;;
            dry-run) required=(TRAVELPAYOUTS_TOKEN) ;;
            normal|force-digest) required=(TRAVELPAYOUTS_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID) ;;
            *) echo "不支援的執行模式" >&2; exit 2 ;;
          esac
          # SERPAPI_API_KEY 為選用：缺席時以 Travelpayouts 模式運作（補上後自動恢復 Google 驗證）。
          if [[ "$MODE" =~ ^(normal|dry-run|force-digest)$ && -z "${SERPAPI_API_KEY:-}" ]]; then
            echo "::notice title=SerpApi 未設定::SerpApi 未設定，以 Travelpayouts 模式運作（票價為快取價，未經 Google 驗證）。"
            echo "SerpApi 未設定，以 Travelpayouts 模式運作；補上 \`SERPAPI_API_KEY\` 後自動恢復 Google 驗證。" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          missing=()
          for secret_name in "${required[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then missing+=("$secret_name"); fi
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi
          echo "ready=false" >> "${GITHUB_OUTPUT:-/dev/null}"
          {
            echo "### LowFly：缺少 Secrets，本次未掃描"
            echo "尚未設定：\`${missing[*]}\`"
            echo "到 Settings → Secrets and variables → Actions → New repository secret 補上即可恢復。"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [[ "$EVENT" == "schedule" ]]; then
            for n in "${missing[@]}"; do
              echo "::warning title=Missing repository Secret::${n} 尚未設定；排程本次跳過，不掃描、不更新正式資料。"
            done
            exit 0
          fi
          for n in "${missing[@]}"; do
            echo "::error title=Missing repository Secret::${n} 尚未設定；本次不執行掃描，也不更新正式資料。"
          done
          exit 1

  # 掃描 job 會安裝 PyPI 套件、讀第三方網頁：只給讀取權，checkout 也不留 token，
  # 就算套件被投毒也推不了 main。結果打包成 artifact 交給 publish。
  scan:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      telegram_failed: ${{ steps.scan.outputs.telegram_failed }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: 安裝中文字體
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 安裝依賴
        run: pip install -r requirements-dev.txt
      - name: 離線驗收與靜態檢查
        if: github.event_name == 'schedule' || github.event_name == 'issues' || inputs.run_checks
        run: |
          python -m pytest -q
          node --check docs/app.js
          node --check docs/utils.js
          node --check docs/config.js
          node --check docs/sw.js
          node --test tests/frontend.test.cjs
          python scripts/check_exports.py
      # main 結束碼：0 正常；1 不寫入（state 讀不到、Travelpayouts 0 筆）；3 已寫入但 Telegram 送失敗（存檔後再標紅）。
      - name: 執行掃描
        id: scan
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'normal' }}
        run: |
          set +e
          case "$MODE" in
            normal) python -m lowfly.main ;;
            dry-run) python -m lowfly.main --dry-run ;;
            test-telegram) python -m lowfly.main --test-telegram ;;
            force-digest) python -m lowfly.main --force-digest ;;
            mock) python -m lowfly.main --mock --force-digest ;;
            *) echo "不支援的執行模式" >&2; exit 1 ;;
          esac
          rc=$?
          set -e
          if [[ $rc -eq 3 ]]; then
            echo "::error title=Telegram 推播失敗::資料已更新，但有推播沒送出；請檢查 TELEGRAM_BOT_TOKEN／TELEGRAM_CHAT_ID。"
            echo "telegram_failed=true" >> "${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi
          exit $rc
      - name: 檢查本次匯出
        if: inputs.mode == '' || inputs.mode == 'normal' || inputs.mode == 'force-digest'
        run: python scripts/check_exports.py
      - name: 打包狀態與公開資料
        if: inputs.mode == '' || inputs.mode == 'normal' || inputs.mode == 'force-digest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lowfly-data
          path: |
            data/
            docs/data/
          if-no-files-found: error
          retention-days: 1
      - name: 保留模擬預覽
        if: inputs.mode == 'mock'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lowfly-mock-preview
          path: out/mock/
          retention-days: 7

  # 唯一有寫入權的 job：不裝任何套件、不跑專案程式（只用系統 python3 跑純標準庫的合約檢查），
  # 只接受 data/、docs/data/ 的變更，再寫回 main 並請求 Pages 建置。
  publish:
    needs: scan
    if: needs.scan.result == 'success' && (inputs.mode == '' || inputs.mode == 'normal' || inputs.mode == 'force-digest')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lowfly-data
      - name: 檢查資料
        run: |
          python3 scripts/check_exports.py
          python3 -c "import json; json.load(open('data/state.json', encoding='utf-8'))"
          outside=$(git status --porcelain | awk '$2 !~ /^(data|docs\/data)\// {print $2}')
          if [[ -n "$outside" ]]; then echo "::error title=非預期變更::$outside" >&2; exit 1; fi
      - name: 儲存狀態與公開資料
        id: persist
        run: |
          git config user.name "lowfly-bot"
          git config user.email "lowfly-bot@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT:-/dev/null}"
          else
            git commit -m "chore(state): scan $(date -u +'%Y-%m-%dT%H:%MZ') [skip ci]"
            # 推播已送出，state 一定要寫回，否則下一輪會重推、額度少算：遇到同時 push 就重試三次。
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then break; fi
              if [[ $attempt -eq 3 ]]; then echo "::error title=state 寫回失敗::重試三次仍無法 push" >&2; exit 1; fi
              sleep $((attempt * 15))
            done
            echo "changed=true" >> "${GITHUB_OUTPUT:-/dev/null}"
          fi
      - name: 請求 main／docs 的 Pages 建置
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" \
            -H "Accept: application/vnd.github+json"
      - name: Telegram 推播失敗時標紅
        if: needs.scan.outputs.telegram_failed == 'true'
        run: exit 1

  # 任何一個 job 失敗（測試、掃描、匯出檢查、寫回）都用 Telegram 告知；Telegram 本身壞掉時仍有 GitHub 的失敗通知信。
  alert:
    needs: [preflight, scan, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 失敗告警
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then exit 0; fi
          curl -fsS --max-time 20 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ 低飛 LowFly 掃描失敗（${EVENT}）。資料可能沒有更新，請看執行紀錄：${RUN_URL}" \
            || echo "::warning::失敗告警也送不出去"
