app_name: "低飛 LowFly"
timezone: "Asia/Taipei"
currency: "TWD"
# 清單順序＝優先序（首頁卡片順序、同分輪流時的決勝）。
# 每條航線可覆寫 stay_nights（預設取 window.stay_nights）；
# serpapi_arrival 供 SerpApi arrival_id 使用（可逗號分隔多機場，預設同 destination）。
routes:
  - id: "HKG"
    origin: "TPE"
    destination: "HKG"
    label: "桃園 ⇄ 香港"
    direct_only: true
    adults: 1
  - id: "TYO"
    origin: "TPE"
    destination: "TYO"
    serpapi_arrival: "NRT,HND"
    label: "桃園 ⇄ 東京"
    direct_only: true
    adults: 1
    stay_nights: [4, 5, 6]
  - id: "MFM"
    origin: "TPE"
    destination: "MFM"
    label: "桃園 ⇄ 澳門"
    direct_only: true
    adults: 1
window:
  days_ahead: 30
  min_lead_days: 2
  stay_nights: [3, 4, 5]
thresholds:
  instant: 0.50
  digest: 0.70
  max_instant_per_run: 5   # 單次 run 的即時通知上限，超過的只進摘要池（防第一次跑洗版）
baseline:
  google_stat: "mid"
  lookback_days: 45
  min_observations: 1
  weights:
    google_typical: 1.0
    own_history: 0.0
    social: 0.0
sources:
  travelpayouts:
    enabled: true
  serpapi:
    enabled: true
    monthly_quota: 250
    monthly_safety: 10
    daily_budget: 8
    reserve_for_candidates: 3
    reverify_hours: 12
schedule:
  runs_per_day: 4
digest:
  hour_local: 9
  top_n: 5
dedupe:
  min_drop_ratio: 0.03
  cooldown_hours: 48
