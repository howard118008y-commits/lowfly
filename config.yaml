app_name: "低飛 LowFly"
timezone: "Asia/Taipei"
currency: "TWD"
# 清單順序＝優先序（首頁卡片順序、同分輪流時的決勝）。
# 每條航線可覆寫 stay_nights（預設取 window.stay_nights）；
# serpapi_arrival 供 SerpApi arrival_id 使用（可逗號分隔多機場，預設同 destination）。
routes:
  - id: "HKG"
    color: "#B0124F"      # 前端票根左緣色條
    origin: "TPE"
    destination: "HKG"
    label: "桃園 ⇄ 香港"
    direct_only: true
    adults: 1
    good_price_twd: 4500  # 社群好價線（含稅含行李來回）：低於此價就通知，不論基準
  - id: "MFM"
    color: "#007A4D"      # 前端票根左緣色條
    origin: "TPE"
    destination: "MFM"
    label: "桃園 ⇄ 澳門"
    direct_only: true
    adults: 1
    good_price_twd: 5000
  - id: "TYO"
    color: "#23468F"      # 前端票根左緣色條
    origin: "TPE"
    destination: "TYO"
    serpapi_arrival: "NRT,HND"
    label: "桃園 ⇄ 東京"
    direct_only: true
    adults: 1
    stay_nights: [1, 2, 4, 5, 6]   # 含 2天1夜、3天2夜
    good_price_twd: 9000
window:
  days_ahead: 60            # 社群好價貼文多在出發前 1～2 個月；Travelpayouts 依月份抓，60 天約跨 3 個月
  min_lead_days: 2
  stay_nights: [1, 2, 3, 4, 5]     # 1、2 晚＝2天1夜、3天2夜
thresholds:
  instant: 0.50
  digest: 0.70
  max_instant_per_run: 5   # 單次 run 的即時通知上限，超過的只進摘要池（防第一次跑洗版）
  same_price_within: 0.05  # 推播附「同價位還有 N 個出發日」：同航線總價不超過本票 +5% 的其他出發日
# 以「含託運行李的總價」判斷半價。廉航票價不含託運要加費；傳統航空已含者不加。
# 所有數字都在這裡，程式不寫死。Google typical 基準視為已含行李的總價近似（傳統航空為主），直接與 total 比較。
baggage:
  checked_kg: 20            # 0 = 只帶手提，總價＝票價
  pieces_each_way: 1
  # 2026-11-02 查證（多為搜尋摘要與比價站彙整，可信度中；換季或改價請以訂位頁實測為準）
  included: [CI, BR, JX, CX, NX, JL, NH]   # 最低經濟艙已含託運（NX 32kg，其餘 23kg）
  fees_twd:                 # 單程一件 20kg 線上預購價，依航線 id
    UO: {HKG: 1400}         # HK Express，機場購買約 2,600
    TR: {TYO: 940}          # 酷航，開票後加購約 1,190
    GK: {TYO: 900}          # 捷星日本
    HB: {HKG: 1520}         # 大灣區航空 HK$380（以 1:4.0 換算）
    MM: {TYO: 930}          # 樂桃 Zone B（台灣—東京）網路加購，機場櫃台 1,300（2026-11-02 比價站，官網未讀到）
    IT: {HKG: 950, MFM: 950, TYO: 950}   # 台灣虎航 tigerlight 加購 20kg；tigersmart／tigerpro 已含（2026-09-30 比價站）
    ZG: {TYO: 1200}         # ZIPAIR 台北—東京官網費率表（一件上限 30kg，線上預購免手續費）
  # 香港航空 HX 官網擋爬蟲、最低票種含不含託運未證實：走下方估算並標示「行李費估算」
  unknown_fee_twd: 1500     # 不在 included 也不在 fees_twd 的航空：用此值估算並標示「行李費估算」
# 優惠須知：推播與票根都會先列出。2026-11-02 依 PTT／Threads／新聞整理，可信度中，以航空公司官網為準。
notices:
  airlines:
    IT: ["手提 10kg、54×38×23cm，立體量架連輪子都算，超標每件罰 2,000", "促銷票限買來回：去程沒搭，回程會被取消"]
    UO: ["手提＋隨身物品合計 7kg，腰包也算一件"]
    MM: ["手提 10kg、三邊合計 115cm，腳輪和握把也算"]
  late_arrival:             # 當地抵達時間晚於 after（或 05:00 前）時提醒
    NRT: {after: "21:30", text: "深夜抵達成田：電車與巴士可能已收班，計程車到新宿約 ¥24,000"}
    HND: {after: "23:30", text: "深夜抵達羽田：計程車有深夜加成，到新宿約 ¥9,800"}
  suspect_error:            # 疑似錯價：總價 ≤ 基準的 ratio（打 2 折以下）時置頂提醒；錯價票被取消通常只退票款
    ratio: 0.20
    text: "疑似錯價：可能被航空公司取消（只退票款），先別訂飯店與不可退的行程"
baseline:
  google_stat: "mid"
  lookback_days: 45
  average_days: 30          # 票根「近 N 天均價」；不可大於 lookback_days（樣本只保留回看期）
  min_observations: 1
  weights:
    google_typical: 1.0
    own_history: 0.0
    social: 0.0
sources:
  travelpayouts:
    enabled: true
    one_way: true           # 另抓去、回單程拼成來回（2026-11-04 實測可定價組合約 5 倍）；每輪多 18 次請求
  serpapi:
    enabled: true
    monthly_quota: 250
    monthly_safety: 10
    daily_budget: 8
    reserve_for_candidates: 3
    reverify_hours: 12
schedule:
  runs_per_day: 4
  # 航空促銷旺季：scan.yml 第二條 cron 只在這些月份加跑，改這裡要同步改 cron 的月份欄。
  promo_months: [5, 6, 11, 12]
  promo_runs_per_day: 8
# 行情分頁：過去 3／6 個月＝LowFly 每天記錄的含行李價平均（自 2026-11-02 起累積）；
# 未來 3／6 個月＝未來 months_ahead 個月出發的 Travelpayouts 快取均價（每天抓一次，住宿晚數同上）。
# reference：外部網站公布的參考值（一次性整理）。2026-11-04 查無公開的過去 3／6 個月逐月均價，只有 Kayak 過去 12 個月最便宜／最貴月份。
market:
  months_ahead: 6
  reference:
    HKG:
      - {source: "Kayak", url: "https://www.tw.kayak.com/flight-routes/Taipei-Taiwan-Taoyuan-Intl-TPE/Hong-Kong-Intl-HKG", text: "過去 12 個月最便宜 3 月 NT$4,845、最貴 2 月 NT$6,862（來回，未註明含行李與直飛）"}
    MFM:
      - {source: "Kayak", url: "https://www.tw.kayak.com/flight-routes/Taipei-Taiwan-Taoyuan-Intl-TPE/Macau-Intl-MFM", text: "過去 12 個月最便宜 1 月 NT$6,536、最貴 6 月 NT$8,423（來回，未註明含行李與直飛）"}
    TYO:
      - {source: "Kayak", url: "https://www.tw.kayak.com/flight-routes/Taipei-Taiwan-Taoyuan-Intl-TPE/Tokyo-TYO", text: "過去 12 個月最便宜 5 月 NT$8,553、最貴 2 月 NT$15,772；頁面平均來回 NT$9,300（期間未註明）"}
digest:
  hour_local: 9
  top_n: 5
# 航線新低：本輪最低價比近 days 天（該航線所有出發日）看過的最低價再低 dedupe.min_drop_ratio 以上就推播，不論基準與好價線。
# 樣本來自 tp_samples（自 2026-11-02 起每天每組一筆），days 不可大於 baseline.lookback_days；紀錄未滿 min_days 天不推，避免剛啟動時天天「新低」。
new_low:
  days: 30
  min_days: 7
# 廉航促銷消息：官網限時促銷先開賣、Travelpayouts 快取抓不到，改看新聞與 PTT 標題，有新的就推一則。
# 來源字串：news:<Google 新聞關鍵字>（自動加「促銷 OR 開賣 OR 優惠」與近 3 天）、ptt:<板名>:<標題關鍵字>、hkexpress（香港快運首頁促銷頁）。
# 2026-11-04 實測：虎航／酷航／樂桃／捷星／ZIPAIR 官網需 JS 或擋爬蟲；PTT 沒有 AirTicket 板，虎航促銷多在 Japan_Travel 有 [資訊] 整理文。
# 標題要含 keywords 之一、不含 exclude、並提到 match 之一（官網來源免）；預期仍有約 3 成誤報（旅展懶人包、轉載舊文）。
airline_sales:
  enabled: true
  max_age_hours: 48
  keep_days: 30
  max_items_per_airline: 3
  keywords: [促銷, 開賣, 開搶, 限時, 快閃, 優惠, 元起, 折, 旅展, 特價, sale, flash]
  exclude: [信用卡, 刷卡, 股, 營收, 外資, 懶人包, 飯店, 酒店, 里數]
  airlines:
    IT: {name: "台灣虎航", match: [虎航, Tigerair], sources: ["news:虎航", "ptt:Japan_Travel:虎航"]}
    UO: {name: "香港快運", match: [香港快運, HK Express], sources: ["news:香港快運", "hkexpress"]}
    TR: {name: "酷航", match: [酷航, Scoot], sources: ["news:酷航"]}
    MM: {name: "樂桃航空", match: [樂桃, Peach], sources: ["news:樂桃"]}
    GK: {name: "捷星日本", match: [捷星, Jetstar], sources: ["news:捷星"]}
    ZG: {name: "ZIPAIR", match: [ZIPAIR], sources: ["news:ZIPAIR"]}
dedupe:
  min_drop_ratio: 0.03
  cooldown_hours: 48
